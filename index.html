<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws://localhost:*"
    />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tally</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <header class="topbar" data-geo="topbar">
      <span class="brand">Tally</span>
      <nav aria-label="Sections">
        <button type="button" data-screen="transactions" aria-current="page">Transactions</button>
        <button type="button" data-screen="settings">Settings</button>
      </nav>
    </header>
    <p id="notice" class="notice" role="alert" hidden></p>
    <main id="screen" class="screen" data-geo="screen"></main>
    <footer class="meta" data-geo="meta">
      <span>backend: <strong id="backend-badge" data-testid="backend-badge">…</strong></span>
      <span>platform: <span id="platform" data-testid="platform">…</span></span>
    </footer>
  </body>
</html>
